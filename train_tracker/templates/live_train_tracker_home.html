<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>trainwatch &middot; tilbury town</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --amber: #ffb000;
      --amber-dim: #7a5a2a;
      --line: #262a26;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--amber);
      font-family: "Space Mono", "Courier New", monospace;
      padding: 40px 24px;
    }
    .board { max-width: 760px; margin: 0 auto; }
    .board-header {
      display: flex; justify-content: space-between; align-items: baseline;
      border-bottom: 2px solid var(--amber); padding-bottom: 12px; margin-bottom: 4px;
    }
    .board-header h1 { font-size: 1.4rem; letter-spacing: 0.08em; margin: 0; text-transform: uppercase; }
    .status-dot {
      width: 9px; height: 9px; border-radius: 50%; background: var(--amber);
      display: inline-block; margin-right: 8px; box-shadow: 0 0 8px var(--amber);
    }
    .status-line { font-size: 0.8rem; color: var(--amber-dim); }
    .row-labels {
      display: grid; grid-template-columns: 100px 120px 1fr 100px; gap: 12px;
      font-size: 0.7rem; color: var(--amber-dim); padding: 10px 4px;
      border-bottom: 1px solid var(--line); text-transform: uppercase;
    }
    .event-row {
      display: grid; grid-template-columns: 100px 120px 1fr 100px; gap: 12px;
      padding: 14px 4px; border-bottom: 1px solid var(--line); font-size: 1.05rem;
    }
    .event-row .time { color: var(--amber); }
    .event-row .headcode { color: var(--amber); font-weight: bold; }
    .event-row .movement { color: var(--amber-dim); }
    .event-row .area { text-align: right; color: var(--amber-dim); }
    .empty { padding: 32px 4px; color: var(--amber-dim); font-size: 0.9rem; }
    footer { margin-top: 28px; font-size: 0.7rem; color: var(--amber-dim); text-align: center; }
  </style>
</head>
<body>
  <div class="board">
    <div class="board-header">
      <h1>trainwatch &middot; tilbury town</h1>
      <div class="status-line"><span class="status-dot"></span><span>ACTIVE</span></div>
    </div>
    <div class="row-labels">
      <div>Time</div><div>Headcode</div><div>Movement</div><div style="text-align: right;">Area</div>
    </div>
    <div class="events" id="events">
      <div class="empty">Loading recent train events...</div>
    </div>
    <footer>Live berth-level tracking &middot; SQLite persistence (auto-purged @ 24h)</footer>
  </div>

  <script>
    const eventsEl = document.getElementById("events");

    async function loadRecent() {
      try {
        const resp = await fetch("/events/recent");
        const data = await resp.json();
        

        eventsEl.innerHTML = "";
        data.forEach(ev => {
          const row = document.createElement("div");
          row.className = "event-row";
          row.innerHTML = `
            <div class="time">${ev.time}</div>
            <div class="headcode">${ev.headcode}</div>
            <div class="movement">${ev.from_berth} &rarr; ${ev.to_berth}</div>
            <div class="area">[${ev.area}]</div>
          `;
          eventsEl.appendChild(row);
        });
      } catch (e) {
        console.error("Failed to fetch train events:", e);
      }
    }

    loadRecent();
    setInterval(loadRecent, 5000);
  </script>
</body>
</html>
