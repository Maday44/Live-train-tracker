<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>trainwatch — Tilbury Town</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #111311;
      --amber: #ffb000;
      --amber-dim: #7a5a2a;
      --red: #ff4136;
      --line: #262a26;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--amber);
      font-family: "Space Mono", "Courier New", monospace;
      min-height: 100vh;
      padding: 40px 24px;
    }

    .board {
      max-width: 760px;
      margin: 0 auto;
    }

    .board-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 2px solid var(--amber);
      padding-bottom: 12px;
      margin-bottom: 4px;
    }

    .board-header h1 {
      font-size: 1.4rem;
      letter-spacing: 0.08em;
      margin: 0;
      text-transform: uppercase;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--amber-dim);
      display: inline-block;
      margin-right: 8px;
      box-shadow: 0 0 6px var(--amber-dim);
    }

    .status-dot.live {
      background: var(--amber);
      box-shadow: 0 0 8px var(--amber);
    }

    .status-line {
      font-size: 0.8rem;
      color: var(--amber-dim);
    }

    .row-labels {
      display: grid;
      grid-template-columns: 100px 120px 1fr 100px;
      gap: 12px;
      font-size: 0.7rem;
      color: var(--amber-dim);
      padding: 10px 4px;
      border-bottom: 1px solid var(--line);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .events {
      display: flex;
      flex-direction: column;
    }

    .event-row {
      display: grid;
      grid-template-columns: 100px 120px 1fr 100px;
      gap: 12px;
      padding: 14px 4px;
      border-bottom: 1px solid var(--line);
      font-size: 1.05rem;
      letter-spacing: 0.03em;
      animation: flicker-in 0.4s ease-out;
    }

    @keyframes flicker-in {
      0% { opacity: 0; }
      30% { opacity: 0.6; }
      50% { opacity: 0.1; }
      100% { opacity: 1; }
    }

    .event-row .time { color: var(--amber); }
    .event-row .headcode { color: var(--amber); text-transform: uppercase; font-weight: bold; }
    .event-row .movement { color: var(--amber-dim); }
    .event-row .area { text-align: right; color: var(--amber-dim); }

    .empty {
      padding: 32px 4px;
      color: var(--amber-dim);
      font-size: 0.9rem;
    }

    footer {
      margin-top: 28px;
      font-size: 0.7rem;
      color: var(--amber-dim);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="board">
    <div class="board-header">
      <h1>trainwatch &middot; tilbury town</h1>
      <div class="status-line">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">connecting</span>
      </div>
    </div>

    <div class="row-labels">
      <div>Time</div>
      <div>Headcode</div>
      <div>Movement</div>
      <div style="text-align: right;">Area</div>
    </div>

    <div class="events" id="events">
      <div class="empty">Waiting for a train to pass...</div>
    </div>

    <footer>Live berth-level tracking &middot; Network Rail TD feed</footer>
  </div>

<script>
  const evtSource = new EventSource("/events");
  const eventsEl = document.getElementById("events");
  const statusDot = document.getElementById("status-dot");
  const statusText = document.getElementById("status-text");

  evtSource.onopen = () => {
    statusDot.classList.add("live");
    statusText.textContent = "live";
  };

  evtSource.onerror = () => {
    statusDot.classList.remove("live");
    statusText.textContent = "reconnecting...";
  };

  function playAlertSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.connect(ctx.destination);
      osc.frequency.value = 880;
      osc.start();
      osc.stop(ctx.currentTime + 0.3);
    } catch (e) {}
  }

  function addEvent(data) {
    const empty = eventsEl.querySelector(".empty");
    if (empty) empty.remove();

    const row = document.createElement("div");
    row.className = "event-row";

    row.innerHTML = `
      <div class="time">${data.time || "--:--:--"}</div>
      <div class="headcode">${data.train_id || "TRAIN"}</div>
      <div class="movement">${data.from_berth || "----"} &rarr; ${data.to_berth || "----"}</div>
      <div class="area">[${data.area || "Q6"}]</div>
    `;

    eventsEl.prepend(row);

    // Limit maximum rows displayed
    while (eventsEl.children.length > 30) {
      eventsEl.removeChild(eventsEl.lastChild);
    }
  }

  evtSource.addEventListener("train_alert", (event) => {
    const data = JSON.parse(event.data);
    if (data.type === "ALERT") {
      playAlertSound();
      addEvent(data);
    }
  });
</script>
</body>
</html>
