<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>trainwatch</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #111311;
    --amber: #ffb000;
    --amber-dim: #7a5a2a;
    --red: #ff4136;
    --line: #262a26;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--amber);
    font-family: "Space Mono", "Courier New", monospace;
    min-height: 100vh;
    padding: 40px 24px;
  }

  .board {
    max-width: 760px;
    margin: 0 auto;
  }

  .board-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid var(--amber);
    padding-bottom: 12px;
    margin-bottom: 4px;
  }

  .board-header h1 {
    font-size: 1.4rem;
    letter-spacing: 0.08em;
    margin: 0;
    text-transform: uppercase;
  }

  .status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--amber-dim);
    display: inline-block;
    margin-right: 8px;
    box-shadow: 0 0 6px var(--amber-dim);
  }

  .status-dot.live {
    background: var(--amber);
    box-shadow: 0 0 8px var(--amber);
  }

  .status-line {
    font-size: 0.8rem;
    color: var(--amber-dim);
  }

  .row-labels {
    display: grid;
    grid-template-columns: 90px 1fr 90px 110px;
    gap: 12px;
    font-size: 0.7rem;
    color: var(--amber-dim);
    padding: 10px 4px;
    border-bottom: 1px solid var(--line);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .events {
    display: flex;
    flex-direction: column;
  }

  .event-row {
    display: grid;
    grid-template-columns: 90px 1fr 90px 110px;
    gap: 12px;
    padding: 14px 4px;
    border-bottom: 1px solid var(--line);
    font-size: 1.05rem;
    letter-spacing: 0.03em;
    animation: flicker-in 0.4s ease-out;
  }

  @keyframes flicker-in {
    0% { opacity: 0; }
    30% { opacity: 0.6; }
    50% { opacity: 0.1; }
    100% { opacity: 1; }
  }

  .event-row .time { color: var(--amber); }
  .event-row .dest { color: var(--amber); text-transform: uppercase; }
  .event-row .headcode { color: var(--amber-dim); }
  .event-row .delay { text-align: right; }
  .event-row .delay.late { color: var(--red); }
  .event-row .delay.ontime { color: var(--amber-dim); }

  .empty {
    padding: 32px 4px;
    color: var(--amber-dim);
    font-size: 0.9rem;
  }

  footer {
    margin-top: 28px;
    font-size: 0.7rem;
    color: var(--amber-dim);
    text-align: center;
  }
</style>
</head>
<body>

  <div class="board">
    <div class="board-header">
      <h1>trainwatch</h1>
      <div class="status-line"><span class="status-dot" id="status-dot"></span><span id="status-text">connecting</span></div>
    </div>

    <div class="row-labels">
      <div>Time</div>
      <div>Destination</div>
      <div>Headcode</div>
      <div>Delay</div>
    </div>

    <div class="events" id="events">
      <div class="empty">Waiting for a train to pass...</div>
    </div>

    <footer>Live berth-level tracking &middot; Network Rail TD feed</footer>
  </div>

<script>
  const API_BASE = window.location.origin;
  const WS_URL = API_BASE.replace(/^http/, "ws") + "/events/live";
  const eventsEl = document.getElementById("events");
  const statusDot = document.getElementById("status-dot");
  const statusText = document.getElementById("status-text");

  function formatTime(iso) {
    if (!iso) return "--:--";
    const d = new Date(iso);
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function renderEvent(ev) {
    const row = document.createElement("div");
    row.className = "event-row";

    const delayMin = ev.delay_minutes;
    let delayText = "on time";
    let delayClass = "ontime";
    if (typeof delayMin === "number") {
      if (delayMin <= 0) {
        delayText = "on time";
      } else {
        delayText = `${delayMin} min late`;
        delayClass = "late";
      }
    }

    row.innerHTML = `
      <div class="time">${formatTime(ev.created_at)}</div>
      <div class="dest">${ev.destination || "unknown"}</div>
      <div class="headcode">${ev.headcode || ""}</div>
      <div class="delay ${delayClass}">${delayText}</div>
    `;
    return row;
  }

  function addEvent(ev) {
    const empty = eventsEl.querySelector(".empty");
    if (empty) empty.remove();
    eventsEl.prepend(renderEvent(ev));
    while (eventsEl.children.length > 30) {
      eventsEl.removeChild(eventsEl.lastChild);
    }
  }

  async function loadRecent() {
    try {
      const resp = await fetch(`${API_BASE}/events/recent?limit=20`);
      const data = await resp.json();
      data.reverse().forEach(addEvent);
    } catch (e) {
      console.error("failed to load recent events", e);
    }
  }

  function connect() {
    const ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      statusDot.classList.add("live");
      statusText.textContent = "live";
    };

    ws.onmessage = (msg) => {
      const ev = JSON.parse(msg.data);
      addEvent(ev);
    };

    ws.onclose = () => {
      statusDot.classList.remove("live");
      statusText.textContent = "reconnecting...";
      setTimeout(connect, 3000);
    };

    ws.onerror = () => ws.close();
  }

  loadRecent();
  connect();
</script>
</body>
</html>
