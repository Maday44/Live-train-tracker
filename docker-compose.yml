services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trainwatch
      POSTGRES_PASSWORD: trainwatch
      POSTGRES_DB: trainwatch
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainwatch -d trainwatch"]
      interval: 3s
      timeout: 3s
      retries: 5
  
  flask:
    build:
      dockerfile: Dockerfile
      target: trainwatch-dev
      args:
        DB_TRAINWATCH_PASSWORD:
    ports:
      - "5000:5000"
    volumes:
      - .:/code
    environment:
      FLASK_ENV: development
  

volumes:
  db_data: