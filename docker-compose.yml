services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trainwatch
      POSTGRES_PASSWORD: trainwatch_password
      POSTGRES_DB: trainwatch
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainwatch -d trainwatch"]
      interval: 3s
      timeout: 3s
      retries: 5

  flask:
    build:
      context: .
      dockerfile: Dockerfile
      target: trainwatch-dev
    ports:
      - "5000:5000"
    volumes:
      - .:/code
    environment:
      FLASK_ENV: development
      FLASK_RUN_HOST: 0.0.0.0
      DATABASE_URL: postgresql://trainwatch:trainwatch_password@db:5432/trainwatch
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: