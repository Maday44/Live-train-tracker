services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trainwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trainwatch_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-trainwatch}
    volumes:
      - db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trainwatch} -d ${POSTGRES_DB:-trainwatch}"]
      interval: 5s
      timeout: 5s
      retries: 5

  flask:
    build:
      context: .
      dockerfile: Dockerfile
      target: trainwatch-dev  # Switched from -dev to production target
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-trainwatch}:${POSTGRES_PASSWORD:-trainwatch_secure_pass}@db:5432/${POSTGRES_DB:-trainwatch}

volumes:
  db_data: